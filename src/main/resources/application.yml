spring:
  application:
    name: relayplus

  datasource:
    url: jdbc:mysql://localhost:3306/relayplus?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}            # Access Token 만료 시간 (기본 1시간)
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000} # Refresh Token 만료 시간 (기본 14일)

cors:
  # 콤마로 구분된 프론트엔드 도메인 목록. 운영 배포 전 실제 도메인으로 교체 필요.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
